apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: petstore-hpa
  namespace: petstore
  labels:
    app: petstore
    app.kubernetes.io/name: petstore
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: petstore-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
