apiVersion: v1
kind: Service
metadata:
  name: petstore-service
  namespace: petstore
  labels:
    app: petstore
    app.kubernetes.io/name: petstore
spec:
  type: ClusterIP
  selector:
    app: petstore
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
# Optional NodePort Service for local cluster testing (Minikube / Kind / K3s)
apiVersion: v1
kind: Service
metadata:
  name: petstore-nodeport
  namespace: petstore
  labels:
    app: petstore
spec:
  type: NodePort
  selector:
    app: petstore
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
