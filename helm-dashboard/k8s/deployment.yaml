apiVersion: apps/v1
kind: Deployment
metadata:
  name: helm-dashboard
  namespace: helm-dashboard
  labels:
    app.kubernetes.io/name: helm-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: helm-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helm-dashboard
    spec:
      serviceAccountName: helm-dashboard-sa
      containers:
        - name: helm-dashboard
          image: ghcr.io/komodorio/helm-dashboard:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--bind=0.0.0.0"
            - "--port=8080"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: helm-dashboard-service
  namespace: helm-dashboard
  labels:
    app.kubernetes.io/name: helm-dashboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: helm-dashboard
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
