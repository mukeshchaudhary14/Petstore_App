apiVersion: v1
kind: Namespace
metadata:
  name: helm-dashboard
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: helm-dashboard-sa
  namespace: helm-dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: helm-dashboard-role
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: helm-dashboard-binding
subjects:
  - kind: ServiceAccount
    name: helm-dashboard-sa
    namespace: helm-dashboard
roleRef:
  kind: ClusterRole
  name: helm-dashboard-role
  apiGroup: rbac.authorization.k8s.io
