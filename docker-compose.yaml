version: '3.8'

services:
  petstore-app:
    container_name: petstore-app
    build:
      context: .
      dockerfile: Dockerfile
    image: petstore-app:latest
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - JPETSTORE_PORT=8080
      - JAVA_OPTS=-Xms256m -Xmx512m -XX:+UseG1GC
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/jpetstore/ || curl -f http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - petstore-network

networks:
  petstore-network:
    name: petstore-network
    driver: bridge
