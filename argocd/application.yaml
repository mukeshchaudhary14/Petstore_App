apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: petstore-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: petstore-app
    app.kubernetes.io/part-of: petstore
spec:
  project: default
  source:
    repoURL: 'https://github.com/mukeshchaudhary14/Petstore_App.git'
    targetRevision: HEAD
    path: helm/petstore
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: petstore
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
