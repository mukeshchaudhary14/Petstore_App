apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: petstore-app-k8s
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: petstore-app-k8s
spec:
  project: default
  source:
    repoURL: 'https://github.com/mukeshchaudhary14/Petstore_App.git'
    targetRevision: HEAD
    path: k8s
    directory:
      recurse: false
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: petstore
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
